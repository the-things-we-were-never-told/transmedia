
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Wrinkle in Time - Messages</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: 'Inter', Arial, Helvetica, sans-serif;
    background: #121210;
    color: #25282b;
}

/* ARROW ICONS */
.arrow-icon {
    width: 29px;
    height: 29px;
    object-fit: contain;
}

/* BACK BUTTON */
.back-button {
    position: fixed;
    top: 22px;
    left: 22px;
    z-index: 100;
    display: block;
    width: 34px;
    height: 34px;
    transition: transform 0.2s ease;
}

.back-button img {
    display: block;
    width: 29px;
    height: 29px;
    object-fit: contain;
}

.back-button:hover {
    transform: translateX(-3px);
}

.back-button:active {
    transform: translateX(-1px);
}

/* CHAT SECTION */
.chat-section {
    min-height: 100vh;
    padding: 60px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: filter 0.3s ease;
}

.chat-section.blurred {
    filter: blur(4px);
    pointer-events: none;
    user-select: none;
}

/* CHAT BOX */
.chat-container {
    width: 100%;
    max-width: 650px;
    background: #f7f4ee;
    border: 1px solid #e4dfd6;
    border-radius: 14px;
    min-height: 600px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* CHAT HEADER */
.chat-header {
    padding: 18px;
    border-bottom: 1px solid #e3ded5;
    background: #f7f4ee;
}

.chat-header strong {
    font-size: 15px;
    font-weight: 600;
}

.chat-header small {
    display: block;
    color: #77736d;
    margin-top: 4px;
    font-size: 12px;
}

/* CHAT MESSAGES */
.chat-messages {
    padding: 25px;
    flex: 1;
    display: flex;
    flex-direction: column;
}

.message {
    max-width: 75%;
    width: fit-content;
    padding: 12px 15px;
    margin-bottom: 15px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.5;
    overflow-wrap: anywhere;
    animation: messageEnter 0.25s ease both;
}

/* MA WHICH'S MESSAGES */
.w {
    background: #e5e5ea;
    color: #25282b;
    margin-right: auto;
    border-bottom-left-radius: 5px;
}

/* MEG'S MESSAGES */
.meg {
    background: #809C66;
    color: #ffffff;
    margin-left: auto;
    border-bottom-right-radius: 5px;
}

/* CHAT CONTROLS */
.chat-controls {
    padding: 15px;
    border-top: 1px solid #e3ded5;
    text-align: center;
    background: #f7f4ee;
}

.chat-button {
    border: none;
    background: #121210;
    color: white;
    padding: 12px 25px;
    cursor: pointer;
    border-radius: 12px;
    font-family: 'Inter', Arial, Helvetica, sans-serif;
    font-size: 13px;
    transition: background 0.2s ease, transform 0.15s ease;
}

.chat-button:hover:not(:disabled) {
    background: #30302d;
    transform: translateY(-1px);
}

.chat-button:active:not(:disabled) {
    background: #080807;
    transform: translateY(1px);
}

.chat-button:disabled {
    background: #aaa;
    cursor: default;
}

.chat-note {
    font-size: 11px;
    color: #77736d;
    margin-top: 8px;
}

/* CONTEXT BUTTON — BOTTOM RIGHT OF PAGE */
.context-wrapper {
    position: fixed;
    right: 25px;
    bottom: 25px;
    z-index: 500;
}

.context-button {
    display: block;
    width: 44px;
    height: 44px;
    padding: 0;
    border: none;
    background: transparent;
    cursor: pointer;
    transition: transform 0.2s ease;
}

.context-button img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.context-button:hover {
    transform: translateY(-2px);
}

.context-dropdown {
    display: none;
    position: absolute;
    bottom: 52px;
    right: 0;
    width: 200px;
    min-height: 75px;
    padding: 12px;
    background: #e9e5dc;
    border: 1px solid #d7d0c4;
    border-radius: 8px;
    color: #25282b;
    font-size: 12px;
    line-height: 1.5;
}

.context-wrapper:hover .context-dropdown,
.context-wrapper.open .context-dropdown {
    display: block;
}

.context-wrapper:hover .context-button img,
.context-wrapper.open .context-button img {
    content: url("book-open.png");
}

/* FINAL PAPER OVERLAY */
.paper-overlay {
    display: none;
    position: fixed;
    inset: 0;
    padding: 24px;
    background: rgba(0, 0, 0, 0.75);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.paper-overlay.show {
    display: flex;
    animation: overlayEnter 0.35s ease both;
}

.paper-link {
    position: relative;
    display: block;
    width: min(90vw, 560px);
    text-decoration: none;
    color: #25282b;
    outline-offset: 6px;
    animation: paperEnter 0.45s ease both;
    transition: transform 0.2s ease, filter 0.2s ease;
}

.paper-link:hover {
    transform: translateY(-3px);
    filter: drop-shadow(0 12px 20px rgba(255, 255, 255, 0.12));
}

.paper-link:active {
    transform: translateY(0);
}

.paper-image {
    display: block;
    width: 100%;
    height: auto;
    max-height: 78vh;
    object-fit: contain;
}

.paper-message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 70%;
    text-align: center;
    font-family: 'Inter', Arial, Helvetica, sans-serif;
    font-size: clamp(14px, 2.5vw, 19px);
    font-weight: 600;
    line-height: 1.65;
    color: #383126;
    pointer-events: none;
}

.paper-hint {
    display: block;
    margin-top: 14px;
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1.2px;
}

/* ANIMATIONS */
@keyframes messageEnter {
    from {
        opacity: 0;
        transform: translateY(6px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes overlayEnter {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes paperEnter {
    from {
        opacity: 0;
        transform: translateY(12px) scale(0.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* RESPONSIVE DESIGN */
@media (max-width: 600px) {
    .arrow-icon {
        width: 26px;
        height: 26px;
    }
}

@media (max-width: 500px) {
    .back-button {
        top: 14px;
        left: 14px;
        width: 34px;
        height: 34px;
    }

    .chat-section {
        padding: 60px 14px 25px;
    }

    .chat-container {
        min-height: 600px;
        border-radius: 12px;
    }

    .chat-messages {
        padding: 20px 15px;
    }

    .message {
        max-width: 85%;
    }

    .context-wrapper {
        right: 16px;
        bottom: 16px;
    }

    .context-button {
        width: 40px;
        height: 40px;
    }

    .context-dropdown {
        bottom: 48px;
    }

    .paper-overlay {
        padding: 16px;
    }

    .paper-link {
        width: 100%;
    }

    .paper-message {
        width: 72%;
        font-size: clamp(12px, 3.5vw, 16px);
    }

    .paper-hint {
        font-size: 9px;
        margin-top: 8px;
    }
}

/* ACCESSIBILITY */
@media (prefers-reduced-motion: reduce) {
    html {
        scroll-behavior: auto;
    }

    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

<body>

<!-- BACK BUTTON -->
<a class="back-button" href="megsthoughts.html" aria-label="Back to previous messages">
    <img class="arrow-icon" src="arrow-back.png" alt="">
</a>

<!-- CHAT WITH MA WHICH -->
<section class="chat-section" id="chat">
    <div class="chat-container">

        <div class="chat-header">
            <strong>Ma Which</strong>
            <small>Encrypted connection</small>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message w">
                Meg, have you found what you're looking for?
            </div>
        </div>

        <div class="chat-controls">
            <button
                class="chat-button"
                id="chatButton"
                type="button"
                onclick="nextChatMessage()">
                Next message
            </button>

            <div class="chat-note" id="chatNote">
                Click Next message to continue.
            </div>
        </div>

    </div>
</section>

<!-- CONTEXT BUTTON -->
<div class="context-wrapper" id="contextWrapper">
    <button
        class="context-button"
        id="contextButton"
        type="button"
        aria-label="Open context"
        aria-expanded="false"
        onclick="toggleContext()">
        <img src="book-closed.png" alt="">
    </button>

    <div class="context-dropdown" id="contextDropdown">
        CONTEXT: Ma Which works alongside Ma Whatsit and Ma Who.
  </div>
</div>

<!-- FINAL PAPER: CLICK TO RETURN TO THE DRIVE -->
<div
    class="paper-overlay"
    id="paperOverlay"
    role="dialog"
    aria-modal="true"
    aria-label="Return to your father's archive">

    <a
        class="paper-link"
        href="thedrive-2.html"
        aria-label="Return to Dad's archive">

        <img
            src="paper-home.png"
            alt="A paper note directing Meg back to her father's archive"
            class="paper-image">

        <span class="paper-message">
            Go back to Dad's archive.
            <span class="paper-hint">Press to continue</span>
        </span>
    </a>
</div>

<script>
/* MA WHICH'S CHAT */

const chatMessages = [
    {
        type: "meg",
        text: "I found Dad's documents. I think I understand what IT and the Black Thing did to him, but I still don't know how to get him back."
    },
    {
        type: "w",
        text: "Then you understand why IT wanted to silence him."
    },
    {
        type: "meg",
        text: "How am I supposed to save him?"
    },
    {
        type: "w",
        text: "You won't save him by trying to become stronger than everyone else."
    },
    {
        type: "w",
        text: "You need the strength to stand against IT, even when everyone else believes what it tells them."
    },
    {
        type: "meg",
        text: "But how? I don't even know where Dad is."
    },
    {
        type: "w",
        text: "IT has tried to separate him from the people, memories and history that make him who he is."
    },
    {
        type: "w",
        text: "You need to reconnect him with those things. Remind him of the life and the people he still belongs to."
    },
    {
        type: "meg",
        text: "I want to help him, but I don't know where to start."
    },
    {
        type: "w",
        text: "Start by returning to his archive."
    },
    {
        type: "w",
        text: "One of the documents contains a phone number written in red. Copy it. You should find a text box where you can paste the number."
    },
    {
        type: "w",
        text: "It will connect you to his device."
    },
    {
        type: "meg",
        text: "Okay... but what do I say when he answers?"
    },
    {
        type: "w",
        text: "Remind him who he is, Meg. Remind him of his family and the community who loves him."
    }
];

let chatIndex = 0;
let finalMessageShown = false;

function nextChatMessage() {
    const button = document.getElementById("chatButton");
    const note = document.getElementById("chatNote");

    if (finalMessageShown) {
        button.disabled = true;
        button.textContent = "Conversation complete";

        note.textContent =
            "There's more to discover in Dad's archive.";

        document.getElementById("chat").classList.add("blurred");
        document.getElementById("paperOverlay").classList.add("show");

        document.querySelector(".paper-link").focus();
        return;
    }

    if (chatIndex >= chatMessages.length) {
        return;
    }

    const data = chatMessages[chatIndex];
    const message = document.createElement("div");

    message.className = "message " + data.type;
    message.textContent = data.text;

    document.getElementById("chatMessages").appendChild(message);

    chatIndex++;

    if (chatIndex >= chatMessages.length) {
        finalMessageShown = true;
        button.textContent = "Continue";
        note.textContent =
            "Read Ma Which's message, then click Continue.";
    }
}

/* CONTEXT DROPDOWN */

function toggleContext() {
    const wrapper = document.getElementById("contextWrapper");
    const button = document.getElementById("contextButton");
    const icon = button.querySelector("img");
    const isOpen = wrapper.classList.toggle("open");

    button.setAttribute("aria-expanded", isOpen);
    button.setAttribute(
        "aria-label",
        isOpen ? "Close context" : "Open context"
    );

    icon.src = isOpen ? "book-open.png" : "book-closed.png";
}

/* CLOSE CONTEXT WHEN CLICKING OUTSIDE */

document.addEventListener("click", function(event) {
    const wrapper = document.getElementById("contextWrapper");

    if (!wrapper.contains(event.target)) {
        wrapper.classList.remove("open");

        const button = document.getElementById("contextButton");
        button.setAttribute("aria-expanded", "false");
        button.setAttribute("aria-label", "Open context");
        button.querySelector("img").src = "book-closed.png";
    }
});
</script>

</body>
</html>
