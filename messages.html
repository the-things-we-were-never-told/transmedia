
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Messages - Mzanzi Connect</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    font-family: 'Inter', sans-serif;
}

body {
    background: #CFC1B7;
    color: #25282b;
}

/* ---------- MESSAGES PAGE ---------- */

.page {
    min-height: 100vh;
    display: flex;
    justify-content: center;
}

.chat-container {
    width: 100%;
    max-width: none;
    background: #fbf6f1;
    border: none;
    border-radius: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.chat-header {
    padding: 18px 20px;
    border-bottom: 1px solid #e5ddd5;
    display: flex;
    align-items: center;
    background: #fbf6f1;
}

.profile {
    width: 42px;
    height: 42px;
    background: #ddd;
    border-radius: 50%;
    margin-right: 12px;
    flex-shrink: 0;
}

.chat-header strong {
    font-size: 15px;
    font-weight: 600;
}

.chat-header small {
    display: block;
    color: #777;
    margin-top: 3px;
    font-size: 12px;
}

.messages {
    padding: 25px;
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* ---------- MESSAGE ANIMATION ---------- */

.message {
    max-width: 75%;
    padding: 12px 15px;
    margin-bottom: 15px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.5;
    overflow-wrap: break-word;
    opacity: 0;
    animation: messageEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    font-family: 'Inter', sans-serif;
}

.w-message {
    background: #e5e0dc;
    color: #25282b;
    margin-right: auto;
    border-bottom-left-radius: 5px;
}

.meg-message {
    background: #007aff;
    color: #ffffff;
    margin-left: auto;
    border-bottom-right-radius: 5px;
}

@keyframes messageEnter {
    from {
        opacity: 0;
        transform: translateY(14px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ---------- DRIVE FILE ATTACHMENT ---------- */

.drive-file {
    display: none;
    text-decoration: none;
    color: #25282b;
    width: 290px;
    max-width: 100%;
    background: #fffaf5;
    border: 1px solid #e1d6cc;
    padding: 0;
    margin-top: 10px;
    cursor: pointer;
    border-radius: 12px;
    overflow: hidden;
    transition: background 0.2s ease, transform 0.2s ease;
    opacity: 0;
    animation: messageEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    font-family: 'Inter', sans-serif;
}

.drive-file:hover {
    background: #f3eae1;
    transform: translateY(-2px);
}

.drive-file-content {
    display: flex;
    flex-direction: column;
}

.drive-file-preview {
    min-height: 105px;
    padding: 17px;
    background: #282725;
    color: #fbf6f1;
    display: flex;
    align-items: center;
    gap: 13px;
    position: relative;
    overflow: hidden;
}

.drive-file-preview::after {
    content: "";
    position: absolute;
    width: 115px;
    height: 115px;
    right: -25px;
    bottom: -55px;
    border: 1px solid rgba(251, 246, 241, 0.2);
    border-radius: 50%;
    box-shadow: 0 0 0 15px rgba(251, 246, 241, 0.04),
                0 0 0 30px rgba(251, 246, 241, 0.03);
    pointer-events: none;
}

.drive-icon {
    width: 45px;
    height: 52px;
    flex-shrink: 0;
    background: #fbf6f1;
    color: #282725;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
    position: relative;
    z-index: 1;
}

.drive-preview-text {
    position: relative;
    z-index: 1;
}

.drive-preview-label {
    font-size: 9px;
    letter-spacing: 1.8px;
    color: #b9afa4;
    margin-bottom: 6px;
    font-family: 'Inter', sans-serif;
}

.drive-preview-title {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.5px;
    font-family: 'Inter', sans-serif;
}

.drive-file-details {
    padding: 13px 15px 15px;
    font-family: 'Inter', sans-serif;
}

.drive-file-details strong {
    display: block;
    font-size: 13px;
    font-weight: 600;
}

.drive-file-details small {
    display: block;
    color: #777;
    font-size: 11px;
    margin-top: 5px;
}

/* ---------- CHAT CONTROLS ---------- */

.controls {
    border-top: 1px solid #e5ddd5;
    padding: 15px;
    text-align: center;
    background: #fbf6f1;
}

.next-button {
    border: none;
    background: #25282b;
    color: white;
    padding: 12px 25px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    transition: background 0.2s ease;
}

.next-button:hover:not(:disabled) {
    background: #444;
}

.next-button:disabled {
    background: #aaa;
    cursor: default;
}

.instruction {
    text-align: center;
    color: #777;
    font-size: 12px;
    margin-top: 10px;
    font-family: 'Inter', sans-serif;
}

/* ---------- MOBILE ---------- */

@media (max-width: 600px) {
    .messages {
        padding: 20px 15px;
    }

    .message {
        max-width: 85%;
    }

    .drive-file {
        width: 280px;
    }
}

/* ---------- REDUCED MOTION ---------- */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

<body>

<!-- MESSAGES PAGE -->
<div class="page" id="messagesPage">

    <div class="chat-container">

        <div class="chat-header">
            <div class="profile"></div>

            <div>
                <strong>Ma Whatsit </strong>
                <small>WARNING: SYSTEM TRUST OF THIS USER IS LOW</small>
            </div>
        </div>

        <div class="messages" id="messages"></div>

        <div class="controls">
            <button
                class="next-button"
                id="nextButton"
                onclick="nextMessage()">
                Next message
            </button>

            <div class="instruction" id="instruction">
                Press next message to continue.
            </div>
        </div>

    </div>
</div>

<script>
/* ---------- CHAT MESSAGES ---------- */

const messages = [
    {
        sender: "Ma W",
        type: "w-message",
        text: "Meg?"
    },
    {
        sender: "Meg",
        type: "meg-message",
        text: "Who is this?"
    },
    {
        sender: "Ma W",
        type: "w-message",
        text: "Someone who knows what happened to your father."
    },
    {
        sender: "Ma W",
        type: "w-message",
        text: "I know where he is."
    },
    {
        sender: "Meg",
        type: "meg-message",
        text: "What??? How do you know my dad?"
    },
    {
        sender: "Meg",
        type: "meg-message",
        text: "Where is he??"
    },
    {
        sender: "Ma W",
        type: "w-message",
        text: "I can't explain everything here."
    },
    {
        sender: "Ma W",
        type: "w-message",
        text: "This should tell you everything."
    }
];

let currentMessage = 0;

function nextMessage() {
    if (currentMessage >= messages.length) {
        return;
    }

    const messageData = messages[currentMessage];
    const message = document.createElement("div");

    message.className = "message " + messageData.type;
    message.textContent = messageData.text;

    document.getElementById("messages").appendChild(message);

    currentMessage++;

    if (currentMessage === messages.length) {
        showDrive();

        document.getElementById("nextButton").disabled = true;

        document.getElementById("instruction").textContent =
            "Ma W has sent you a file. Click it to continue.";
    }
}

/* ---------- SHOW THE DRIVE FILE ---------- */

function showDrive() {
    const file = document.createElement("a");

    /*
      Opens The Drive as a separate page.
      It does not open inside desktop.html or an iframe.
    */
    file.href = "https://github.com/the-things-we-were-never-told/transmedia/thedrive.html";
    file.className = "drive-file";
    file.style.display = "block";
    file.setAttribute("aria-label", "Open The Drive archive");

    file.innerHTML = `
        <div class="drive-file-content">

            <div class="drive-file-preview">
                <div class="drive-icon">▤</div>

                <div class="drive-preview-text">
                    <div class="drive-preview-label">PRIVATE ARCHIVE</div>
                    <div class="drive-preview-title">THE DRIVE</div>
                </div>
            </div>

            <div class="drive-file-details">
                <strong>THE_DRIVE</strong>
                <small>Encrypted archive · 1 file</small>
            </div>

        </div>
    `;

    document.getElementById("messages").appendChild(file);
}
</script>

</body>
</html>
